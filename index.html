<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B16">
<title>CAMEO · 酒令派对</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(214,171,84,.20), transparent 62%),
      radial-gradient(700px 480px at 85% 108%, rgba(120,60,180,.22), transparent 66%),
      #0E0B16;
    color:#F5EFE6; display:flex; flex-direction:column; align-items:center;
    padding:26px 20px calc(30px + env(safe-area-inset-bottom));
    min-height:100vh; min-height:100dvh;
  }
  .logo{font-size:clamp(22px, 7vw, 30px); letter-spacing:.14em; color:#D6AB54; font-weight:900; margin-top:2px; white-space:nowrap;}
  .logo b{color:#F5EFE6;}
  h1{margin:10px 0 4px; font-size:clamp(19px, 5.4vw, 24px); letter-spacing:1px; font-weight:900; text-align:center;}
  .sub{margin:0 0 6px; font-size:13px; color:#9A8FA8; text-align:center;}
  .tablebadge{
    display:inline-flex; align-items:center; gap:8px; margin:12px 0 24px;
    padding:8px 18px; border-radius:999px; font-size:15px; font-weight:900; letter-spacing:1px;
    color:#FFE6A8; background:rgba(214,171,84,.12); border:1px solid rgba(214,171,84,.45);
  }
  .tablebadge span{opacity:.6; font-weight:700; font-size:12px; letter-spacing:.05em;}
  .cards{width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px;}
  .card{
    position:relative; display:flex; align-items:center; gap:16px; width:100%;
    padding:20px 18px; border-radius:20px; text-align:left; cursor:pointer;
    border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.045);
    color:inherit; font:inherit; transition:transform .12s ease, box-shadow .18s ease, border-color .18s;
  }
  .card:active{transform:scale(.982);}
  .card .ico{
    flex:0 0 58px; height:58px; border-radius:17px; display:flex; align-items:center; justify-content:center;
    font-size:30px; line-height:1;
  }
  .card .txt{flex:1; min-width:0;}
  .card .t1{font-size:19px; font-weight:900; letter-spacing:.5px; display:flex; align-items:center; gap:7px;}
  .card .t2{margin-top:5px; font-size:12.5px; line-height:1.5; color:#A99FB8;}
  .card .arrow{flex:0 0 auto; font-size:20px; color:rgba(255,255,255,.35);}
  .card.party{
    background:linear-gradient(135deg, rgba(214,171,84,.20), rgba(120,60,180,.16));
    border-color:rgba(214,171,84,.55); box-shadow:0 14px 34px -18px rgba(214,171,84,.75);
  }
  .card.party .ico{background:linear-gradient(140deg,#F0C86B,#B4762C); color:#2A1B06; box-shadow:0 8px 18px -10px rgba(240,200,107,.9);}
  .card.song{border-color:rgba(255,215,94,.4); background:rgba(255,215,94,.07);}
  .card.song .ico{background:linear-gradient(140deg,#FFE08A,#E8A93A); color:#4A3006; box-shadow:0 8px 18px -10px rgba(255,224,138,.8);}
  .tag{
    font-size:10.5px; font-weight:900; padding:2px 7px; border-radius:999px; letter-spacing:.04em;
    background:rgba(120,220,150,.16); color:#7EE3A2; border:1px solid rgba(120,220,150,.35);
  }
  .foot{margin-top:auto; padding-top:26px; text-align:center; font-size:11.5px; line-height:1.9; color:#6E647D;}
  .foot b{color:#9A8FA8; font-weight:700;}
  .lanbar{
    display:none; width:100%; max-width:440px; margin:0 0 16px; padding:14px 16px;
    border-radius:16px; text-align:left; cursor:pointer; font:inherit; color:#0B2A18;
    background:linear-gradient(135deg,#8CF0B4,#3ECF82); border:none; box-shadow:0 12px 30px -14px rgba(62,207,130,.8);
    transition:transform .12s ease;
  }
  .lanbar:active{transform:scale(.98);}
  .lanbar .t1{font-size:16px; font-weight:900;}
  .lanbar .t2{margin-top:3px; font-size:12px; font-weight:700; opacity:.75;}
  .weblink{
    display:none; margin:14px auto 0; padding:8px 16px; border-radius:999px;
    font-size:12.5px; font-weight:700; color:#9A8FA8; text-decoration:none;
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04);
  }
  .toastbox{
    position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:rgba(20,16,30,.96); border:1px solid rgba(255,255,255,.14); color:#F5EFE6;
    padding:11px 18px; border-radius:14px; font-size:13.5px; max-width:86vw; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:99;
  }
  .toastbox.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .langbtn{
    border:1.5px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#F5EFE6;
    border-radius:999px; cursor:pointer; font-weight:900; letter-spacing:1px; font-family:inherit;
  }
  .langbtn:active{transform:scale(.94);}
</style>
</head>
<body>
  <div class="logo">C A M E O <b>·</b> 酒 令 派 对</div>
  <button class="langbtn" type="button" aria-label="Switch language" style="position:fixed;top:14px;right:14px;width:44px;height:30px;font-size:13px;">EN</button>
  <h1>开一局？</h1>
  <p class="sub">云端 7×24 在线 · 电脑关机也能玩</p>
  <div class="tablebadge" id="tb" style="display:none;"><em style="font-style:normal;">—</em> 号桌</div>

  <button class="lanbar" id="lanbar" style="display:none;">
    <span class="t1">⚡ 已连上店里 WiFi · 进入极速版</span>
    <span class="t2">店内局域网直连，快 50 倍 · 点一点就切换</span>
  </button>

  <div class="cards">
    <button class="card party" id="btnParty">
      <span class="ico">🎉</span>
      <span class="txt">
        <span class="t1">酒令派对 <span class="tag">随时可玩</span></span>
        <span class="t2">女巫的毒药 · 天命轮盘 · 大话骰 · 谁是卧底<br>扫同一张码的人自动同房，动作全桌同步</span>
      </span>
      <span class="arrow">›</span>
    </button>

    <button class="card song" id="btnSong">
      <span class="ico">🎵</span>
      <span class="txt">
        <span class="t1">扫码点歌 <span class="tag">店内可用</span></span>
        <span class="t2">搜歌点播 · 生日祝福上大屏<br>连店里 WiFi 即点即播，画面秒上电视</span>
      </span>
      <span class="arrow">›</span>
    </button>
  </div>

  <div class="foot" id="foot">
    <b>扫同一张桌卡的人自动进同一桌派对</b><br>
    第一个进来的是房主 · 可以邀请微信好友<br>
    <span style="opacity:.7;">版本 v1024p·<em id="verLine" style="font-style:normal;">…</em></span>
  </div>
  <a id="lanManual" href="#" style="display:none;margin:-8px auto 0;font-size:12px;color:#7EE3A2;text-decoration:underline;">在店里？点此进入店内极速版（快 50 倍）→</a>

  <div class="toastbox" id="toast"></div>
  <a class="weblink" id="weblink" href="#">出门用流量？打开线上版 →</a>

<script src="i18n.js?v=1024p"></script>
<script>
(function () {
  var tb = document.getElementById('tb');
  var btnParty = document.getElementById('btnParty');

  /* 桌号：URL ?t=D1 优先，其次记住上次的 */
  var table = (location.search.match(/[?&]t=([^&]*)/) || [])[1];
  table = table ? decodeURIComponent(table).trim().toUpperCase() : '';
  if (!table) { try { table = (localStorage.getItem('jl_last_table') || '').toUpperCase(); } catch (e) {} }
  if (table) {
    try { localStorage.setItem('jl_last_table', table); } catch (e) {}
    tb.style.display = 'inline-flex';
    tb.innerHTML = table + ' 号桌 <span>· 同桌的人会自动进同一个派对</span>';
  }
  var carry = table ? ('?t=' + encodeURIComponent(table)) : '';
  /* 餐桌二维码带 juke=1：扫码后直达点歌台（仍需店内 WiFi，点歌要连店里服务） */
  var wantSong = /[?&]juke=1/.test(location.search);
  var songQ = wantSong ? (carry ? '&juke=1' : '?juke=1') : '';

  /* ===== 线路自动切换 =====
     线上版（https）：探测店里局域网服务，探测到 = 连了店 WiFi → 顶部亮「极速版」入口
     局域网版（http）：给出门用流量的客人留线上版入口 */
  var isLanPage = location.protocol === 'http:';
  var ONLINE_URL = 'https://fanggao170-del.github.io/cameo-party/';
  /* 免固定 IP：店内服务启动后会把当前局域网 IP 发布到线上公共仓库的 lan.json（每 10 分钟心跳）。
     这里读出最新地址，15 分钟内的登记视为"店内服务在线"。 */
  var LAN_REPO = 'fanggao170-del/cameo-party';
  var LAN_URL = null;   /* 动态解析后填入 */
  var lanTarget = function () { return LAN_URL + (wantSong ? '/song' : '/') + carry; };
  function toast(msg){ var t = document.getElementById('toast'); if (!t) return; t.textContent = msg; t.classList.add('on'); clearTimeout(t.__tm); t.__tm = setTimeout(function(){ t.classList.remove('on'); }, 2600); }
  try { document.getElementById('verLine').textContent = isLanPage ? '店里极速' : '云端'; } catch (e) {}
  if (isLanPage) {
    var wl = document.getElementById('weblink');
    wl.href = ONLINE_URL + carry;
    wl.style.display = 'inline-block';
    /* 已到店内服务 + 扫的是餐桌码 → 直接进点歌台 */
    if (wantSong) { location.replace('/song' + carry); return; }
  } else {
    /* ===== 线路自动切换（v1024p 动态地址版）=====
       ① 读 lan.json（匿名 Contents API，公共仓库免费额度足够；失败回退同源静态副本）
       ② 登记新鲜 → 亮「极速版」按钮 + 常客自动跳 + 旧浏览器探测跳
       ③ 登记过期（店里电脑关机超 15 分钟）→ 只留手动保底链接
       ④ 从没登记过 → 纯线上模式，不显示入口 */
    var gone = false;
    var probeN = 0;
    var bar = document.getElementById('lanbar');
    var lm = document.getElementById('lanManual');
    var remember = function () { try { localStorage.setItem('jl_lan_used', JSON.stringify({ t: Date.now() })); } catch (e) {} };
    function parseLan(d) {
      if (!d || !d.ips || !d.ips.length) return null;
      return { url: 'http://' + d.ips[0] + ':' + (d.port || 8877), fresh: (Date.now() - (d.t || 0)) < 15 * 60 * 1000 };
    }
    function fetchLan() {
      return fetch('https://api.github.com/repos/' + LAN_REPO + '/contents/lan.json?_=' + Date.now(), { cache: 'no-store', headers: { 'Accept': 'application/vnd.github+json' } })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (j) { try { return JSON.parse(decodeURIComponent(escape(atob(String(j.content).replace(/\s/g, ''))))); } catch (e) { return null; } })
        .catch(function () {
          return fetch('./lan.json?_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        });
    }
    var goLan = function () {
      if (gone || !LAN_URL) return; gone = true;
      remember();
      bar.style.display = 'block';
      bar.querySelector('.t1').textContent = '⚡ 已连上店里 WiFi · 正在切换极速版…';
      bar.querySelector('.t2').textContent = '桌号自动带上，马上就好';
      setTimeout(function () { location.replace(lanTarget()); }, 350);
    };
    var probeOnce = function () {
      if (gone || !LAN_URL) return;
      try { fetch(LAN_URL + '/ping.png?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' }).then(function () { goLan(); }).catch(function () {}); } catch (e) {}
      try {
        var img = new Image();
        img.onload = goLan;
        img.src = LAN_URL + '/ping.png?t=' + Date.now() + '&n=' + (++probeN);
      } catch (e) {}
    };
    fetchLan().then(function (d) {
      var info = parseLan(d);
      if (!info) {   /* ④ 纯线上模式 */
        if (wantSong) toast('点歌台要连店里 WiFi · 连上后重新扫码即可');
        return;
      }
      LAN_URL = info.url;
      lm.href = lanTarget();
      lm.style.display = 'block';
      lm.addEventListener('click', remember);
      if (!info.fresh) return;   /* ③ 只留手动保底链接 */
      /* 常客：用过极速版的设备 12 小时内再扫码直接自动跳（30 秒防循环） */
      try {
        var lu = JSON.parse(localStorage.getItem('jl_lan_used') || '0');
        var lt = parseInt(localStorage.getItem('jl_lan_try') || '0', 10);
        if (lu && Date.now() - lu.t < 12 * 3600 * 1000 && Date.now() - lt > 30000) {
          localStorage.setItem('jl_lan_try', String(Date.now()));
          remember();
          location.replace(lanTarget());
          return;
        }
      } catch (e) {}
      /* ② 手动按钮立即亮出（现代浏览器拦自动探测，按钮一秒可点） */
      bar.style.display = 'block';
      bar.querySelector('.t1').textContent = '⚡ 一键进入店内极速版';
      bar.querySelector('.t2').textContent = '连店里 WiFi 快 50 倍 · 探测成功会自动切，没切就点一下';
      bar.onclick = function () { remember(); location.href = lanTarget(); };
      probeOnce();
      var probeIv = setInterval(probeOnce, 2000);
      setTimeout(function () { clearInterval(probeIv); }, 20000);   /* 20 秒后放弃自动探测（手动入口仍在） */
    });
  }

  btnParty.onclick = function () {
    var q = table ? ('?t=' + encodeURIComponent(table) + '&join=1') : '';
    location.href = './game.html' + q;
  };

  /* 扫码点歌：店内 → 点歌台（与派对同一个服务 /song）；线上 → 先探测店里服务可达再带桌号跳过去 */
  var btnSong = document.getElementById('btnSong');
  btnSong.onclick = function () {
    if (isLanPage) { location.href = '/song' + carry; return; }
    if (!LAN_URL) { toast('没连上店里服务 · 连上店内 WiFi 后再点'); return; }
    /* https 页面顶层跳转 http 不被拦；先探测店里服务在不在线，避免点了看到裸错误页 */
    var img = new Image();
    img.onload = function () { location.href = LAN_URL + '/song' + carry; };
    img.onerror = function () {
      toast('没连上店里服务 · 连上店内 WiFi 后再点');
    };
    img.src = LAN_URL + '/ping.png?t=' + Date.now();
  };
})();
</script>
</body>
</html>
